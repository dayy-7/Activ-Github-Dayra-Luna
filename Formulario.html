<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="formRegistro">
        
       
        <label for="nombre">Nombre completo:</label>
        <br>
        <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            required
        >
        <br>
        
        <label for="email">Correo electrónico:</label>
        <br>
        <input 
            type="email" 
            id="email" 
            name="email" 
            required
        >
        <br>

        <label for="password">Contraseña:</label>
        <br>
        <input 
            type="password" 
            id="password" 
            name="password" 
            required
        >
        <br>

       <label for="edad">Edad:</label>
       <br>
        <input 
            type="number" 
            id="edad" 
            name="edad" 
            min="18" 
            max="100" 
            required
        >
        <br><br>

        <label for="fechaNacimiento">Fecha de nacimiento:</label><br>
        <input 
            type="date" 
            id="fechaNacimiento" 
            name="fechaNacimiento" 
            required
        >
        <br>

        <p>Género:</p>
        <input 
            type="radio" 
            id="masculino" 
            name="genero" 
            value="masculino" 
            required
        >
        <label for="masculino">Masculino</label>
        <input 
            type="radio" 
            id="femenino" 
            name="genero" 
            value="femenino" 
        >
        <label for="femenino">Femenino</label>

        <p>Intereses:</p>
        <input 
            type="checkbox" 
            id="tecnologia" 
            name="intereses" 
            value="tecnologia"
        >  
        <label for="tecnologia">Tecnología</label><br>

        <input 
            type="checkbox" 
            id="deportes" 
            name="intereses" 
            value="deportes"
        >
        <label for="deportes">Deportes</label><br>
        <input 
            type="checkbox" 
            id="musica" 
            name="intereses" 
            value="musica"
        >
        <label for="musica">Música</label><br>

        <input 
            type="checkbox" 
            id="arte" 
            name="intereses" 
            value="arte"
        >
        <label for="arte">Arte</label>
        <br><br>

        <label for="fotoPerfil">Fotografía de perfil:</label>
        <br>
        <input 
            type="file" 
            id="fotoPerfil" 
            name="fotoPerfil" 
            accept="image/*"
        >
        <br><br>

        
        <label for="colorFavorito">Color favorito:</label><br>
        <input 
            type="color" 
            id="colorFavorito" 
            name="colorFavorito" 
            value="#ff0000"
        >
        <br><br>

        
        <label for="satisfaccion">Nivel de satisfacción:</label>
        <br>
        <input 
            type="range" 
            id="satisfaccion" 
            name="satisfaccion" 
            min="1" 
            max="10" 
            value="5"><br><br>

        <button type="submit">Registrar</button>

    </form>
</body>
</html>
